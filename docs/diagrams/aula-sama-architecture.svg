<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f97316"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 17px Arial,sans-serif;fill:#475569}
      .section{font:700 20px Arial,sans-serif;fill:#1d4ed8}
      .sectionOrange{font:700 20px Arial,sans-serif;fill:#ea580c}
      .boxTitle{font:700 15px Arial,sans-serif;fill:#0f172a;text-anchor:middle}
      .boxText{font:400 12px Arial,sans-serif;fill:#475569;text-anchor:middle}
      .edgeText{font:600 11px Arial,sans-serif;fill:#475569;text-anchor:middle}
      .edgeTextOrange{font:600 11px Arial,sans-serif;fill:#ea580c;text-anchor:middle}
      .note{font:400 13px Arial,sans-serif;fill:#334155}
      .panel{fill:#ffffff;stroke:#93c5fd;stroke-width:2;stroke-dasharray:7 5}
      .panelOrange{fill:#fffaf5;stroke:#fb923c;stroke-width:2;stroke-dasharray:7 5}
      .box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.6;rx:12}
      .boxBlue{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.8;rx:12}
      .boxGreen{fill:#f0fdfa;stroke:#2dd4bf;stroke-width:1.8;rx:12}
      .boxRed{fill:#fef2f2;stroke:#f87171;stroke-width:1.8;rx:12}
      .boxOrange{fill:#fff7ed;stroke:#fb923c;stroke-width:1.8;rx:12}
      .db{fill:#f8fafc;stroke:#64748b;stroke-width:1.6}
      .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}
      .orangeLine{fill:none;stroke:#f97316;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrowOrange)}
    </style>
  </defs>

  <rect width="1800" height="1040" fill="#f8fafc"/>
  <text x="40" y="52" class="title">Aula-SAMA</text>
  <text x="250" y="52" class="subtitle">Arquitectura RAG para gestión del riesgo en Antioquia</text>
  <text x="40" y="82" class="subtitle">Sistema educativo grounded en fuentes oficiales, trazable y preparado para crecer sin mezclar el RAG con el plano operacional.</text>

  <!-- Panel 1 -->
  <rect x="30" y="110" width="1320" height="480" rx="18" class="panel"/>
  <text x="55" y="145" class="section">1. Serving / RAG educativo</text>

  <rect x="60" y="190" width="150" height="76" class="boxBlue"/>
  <text x="135" y="218" class="boxTitle">Usuario / canal</text>
  <text x="135" y="240" class="boxText">Web · WhatsApp · otros</text>

  <rect x="260" y="190" width="120" height="76" class="box"/>
  <text x="320" y="220" class="boxTitle">Intake</text>
  <text x="320" y="241" class="boxText">recepción y contexto</text>

  <rect x="430" y="174" width="170" height="108" class="boxOrange"/>
  <text x="515" y="207" class="boxTitle">classify_request</text>
  <text x="515" y="229" class="boxText">alcance + urgencia</text>
  <text x="515" y="249" class="boxText">educativo / operacional</text>

  <rect x="665" y="190" width="150" height="76" class="box"/>
  <text x="740" y="218" class="boxTitle">normalize_query</text>
  <text x="740" y="240" class="boxText">normalización / entidades</text>

  <rect x="865" y="184" width="170" height="88" class="boxGreen"/>
  <text x="950" y="213" class="boxTitle">retrieve_hybrid</text>
  <text x="950" y="235" class="boxText">Qdrant dense + sparse</text>
  <text x="950" y="253" class="boxText">RRF + filtros</text>

  <rect x="1080" y="190" width="120" height="76" class="box"/>
  <text x="1140" y="220" class="boxTitle">rerank</text>
  <text x="1140" y="241" class="boxText">top-k evidencia</text>

  <rect x="1235" y="174" width="95" height="108" class="boxOrange"/>
  <text x="1282" y="207" class="boxTitle">assess_</text>
  <text x="1282" y="225" class="boxTitle">evidence</text>
  <text x="1282" y="250" class="boxText">suficiencia</text>

  <path d="M210 228 H252" class="line"/>
  <path d="M380 228 H422" class="line"/>
  <path d="M600 228 H657" class="line"/>
  <path d="M815 228 H857" class="line"/>
  <path d="M1035 228 H1072" class="line"/>
  <path d="M1200 228 H1227" class="line"/>

  <!-- Generation row -->
  <rect x="865" y="350" width="165" height="88" class="boxBlue"/>
  <text x="947" y="381" class="boxTitle">generate_answer</text>
  <text x="947" y="403" class="boxText">solo con evidencia aprobada</text>

  <rect x="1080" y="350" width="150" height="88" class="box"/>
  <text x="1155" y="381" class="boxTitle">attach_citations</text>
  <text x="1155" y="403" class="boxText">IDs verificables</text>

  <rect x="1260" y="350" width="70" height="88" class="boxBlue"/>
  <text x="1295" y="382" class="boxTitle">Respuesta</text>
  <text x="1295" y="405" class="boxText">grounded</text>

  <path d="M1282 282 V320 H947 V342" class="line"/>
  <text x="1110" y="314" class="edgeText">evidencia suficiente</text>
  <path d="M1030 394 H1072" class="line"/>
  <path d="M1230 394 H1252" class="line"/>

  <!-- External fallback -->
  <rect x="430" y="350" width="180" height="88" class="boxBlue"/>
  <text x="520" y="380" class="boxTitle">search_official_sources</text>
  <text x="520" y="402" class="boxText">DAGRAN / SAMA / allowlist</text>

  <rect x="650" y="350" width="165" height="88" class="box"/>
  <text x="732" y="380" class="boxTitle">normalize_external</text>
  <text x="732" y="402" class="boxText">mismo contrato de evidencia</text>

  <path d="M1282 282 V310 H520 V342" class="dash"/>
  <text x="770" y="304" class="edgeText">insuficiente + fallback permitido</text>
  <path d="M610 394 H642" class="line"/>
  <path d="M815 394 H857" class="line"/>
  <text x="844" y="382" class="edgeText">revalida</text>

  <!-- Escalation -->
  <rect x="430" y="475" width="180" height="76" class="boxRed"/>
  <text x="520" y="505" class="boxTitle">escalate</text>
  <text x="520" y="527" class="boxText">mensaje fijo + canal oficial</text>

  <path d="M515 282 V467" class="dash"/>
  <text x="592" y="327" class="edgeText">operacional / fuera de alcance</text>
  <path d="M1282 282 V520 H618" class="dash"/>
  <text x="1000" y="510" class="edgeText">sin evidencia suficiente</text>
  <path d="M610 513 H1295 V446" class="dash"/>

  <rect x="65" y="470" width="300" height="82" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="82" y="495" class="note">El modelo no decide por sí solo si “sabe”.</text>
  <text x="82" y="518" class="note">Un evidence gate explícito controla respuesta,</text>
  <text x="82" y="541" class="note">fallback o escalamiento.</text>

  <!-- Panel 2 -->
  <rect x="30" y="615" width="590" height="385" rx="18" class="panel"/>
  <text x="55" y="650" class="section">2. Persistencia y trazabilidad</text>

  <rect x="65" y="705" width="155" height="190" class="box"/>
  <text x="142" y="740" class="boxTitle">Object storage</text>
  <text x="142" y="768" class="boxText">originales</text>
  <text x="142" y="790" class="boxText">Markdown / JSON</text>
  <text x="142" y="812" class="boxText">imágenes / video</text>
  <text x="142" y="845" class="boxText">S3 / MinIO</text>

  <ellipse cx="330" cy="724" rx="76" ry="15" class="db"/>
  <rect x="254" y="724" width="152" height="150" class="db"/>
  <ellipse cx="330" cy="874" rx="76" ry="15" class="db"/>
  <text x="330" y="765" class="boxTitle">Qdrant</text>
  <text x="330" y="794" class="boxText">chunks</text>
  <text x="330" y="816" class="boxText">dense + sparse</text>
  <text x="330" y="838" class="boxText">metadata</text>

  <ellipse cx="500" cy="724" rx="86" ry="15" class="db"/>
  <rect x="414" y="724" width="172" height="150" class="db"/>
  <ellipse cx="500" cy="874" rx="86" ry="15" class="db"/>
  <text x="500" y="765" class="boxTitle">PostgreSQL</text>
  <text x="500" y="794" class="boxText">source registry</text>
  <text x="500" y="816" class="boxText">audit + state</text>
  <text x="500" y="838" class="boxText">evals / versiones</text>

  <!-- Panel 3 -->
  <rect x="645" y="615" width="705" height="385" rx="18" class="panel"/>
  <text x="670" y="650" class="section">3. Ingesta documental</text>

  <rect x="680" y="715" width="115" height="118" class="boxBlue"/>
  <text x="737" y="746" class="boxTitle">Fuentes</text>
  <text x="737" y="772" class="boxText">PDF · web</text>
  <text x="737" y="794" class="boxText">imagen · video</text>

  <rect x="835" y="715" width="125" height="118" class="box"/>
  <text x="897" y="746" class="boxTitle">source_registry</text>
  <text x="897" y="772" class="boxText">IDs + versiones</text>
  <text x="897" y="794" class="boxText">hash + metadata</text>

  <rect x="1000" y="715" width="130" height="118" class="box"/>
  <text x="1065" y="746" class="boxTitle">Parse / OCR</text>
  <text x="1065" y="772" class="boxText">visión</text>
  <text x="1065" y="794" class="boxText">transcripción</text>

  <rect x="1170" y="715" width="145" height="118" class="box"/>
  <text x="1242" y="746" class="boxTitle">Chunking</text>
  <text x="1242" y="772" class="boxText">estructura + metadata</text>
  <text x="1242" y="794" class="boxText">provenance granular</text>

  <path d="M795 774 H827" class="line"/>
  <path d="M960 774 H992" class="line"/>
  <path d="M1130 774 H1162" class="line"/>

  <rect x="1000" y="870" width="315" height="82" class="boxGreen"/>
  <text x="1157" y="902" class="boxTitle">Dense embedding + sparse representation</text>
  <text x="1157" y="926" class="boxText">upsert versionado → Qdrant</text>
  <path d="M1242 833 V862" class="line"/>

  <!-- Panel 4 -->
  <rect x="1380" y="110" width="390" height="890" rx="18" class="panelOrange"/>
  <text x="1405" y="145" class="sectionOrange">4. Futuro plano operacional</text>
  <text x="1405" y="170" class="subtitle">Separado del RAG educativo</text>

  <rect x="1425" y="225" width="300" height="110" class="boxOrange"/>
  <text x="1575" y="257" class="boxTitle">Sensores / APIs / estaciones</text>
  <text x="1575" y="282" class="boxText">hidrometeorología · geología</text>
  <text x="1575" y="304" class="boxText">infraestructura · pronósticos</text>

  <rect x="1425" y="405" width="300" height="110" class="boxOrange"/>
  <text x="1575" y="437" class="boxTitle">Time-series / geospatial DB</text>
  <text x="1575" y="462" class="boxText">datos históricos y tiempo real</text>

  <rect x="1425" y="585" width="300" height="110" class="boxOrange"/>
  <text x="1575" y="617" class="boxTitle">Reglas / modelos / incident state</text>
  <text x="1575" y="642" class="boxText">detección + análisis + validación</text>

  <rect x="1425" y="765" width="300" height="110" class="boxOrange"/>
  <text x="1575" y="797" class="boxTitle">Motor de alertas / notificaciones</text>
  <text x="1575" y="822" class="boxText">canales operacionales</text>
  <text x="1575" y="844" class="boxText">no controlado por el RAG</text>

  <path d="M1575 335 V397" class="orangeLine"/>
  <path d="M1575 515 V577" class="orangeLine"/>
  <path d="M1575 695 V757" class="orangeLine"/>

  <path d="M1425 640 H1362 V394 H1338" class="orangeLine"/>
  <text x="1378" y="552" class="edgeTextOrange" transform="rotate(-90 1378 552)">consulta read-only</text>

  <!-- Cross panel links -->
  <path d="M950 272 V600 H330 V696" class="dash"/>
  <text x="570" y="605" class="edgeText">retrieval</text>
  <path d="M520 438 V600 H500 V696" class="dash"/>
  <text x="518" y="605" class="edgeText">audit / provenance</text>
  <path d="M897 833 V970 H500 V897" class="dash"/>
  <path d="M1157 952 V970 H330 V897" class="dash"/>

  <text x="40" y="1020" class="subtitle">Aula-SAMA · Arquitectura v1 · Septiembre 2026</text>
</svg>