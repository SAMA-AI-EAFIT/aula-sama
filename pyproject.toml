[project]
name = "aula-sama"
version = "0.1.0"
description = "Asistente educativo RAG para gestión del riesgo en Antioquia"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "voyageai>=0.3",
    "pymupdf>=2.0",
    "youtube-transcript-api>=1.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "streamlit>=1.40",
    "boto3>=1.35",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
aula-sama-ingest = "aula_sama.ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aula_sama"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
